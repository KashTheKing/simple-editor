# Builds the docs site (website/, Docusaurus) and publishes it to GitHub Pages:
# https://kashtheking.com/simple-editor/guide/ (the guide/ folder of the gh-pages branch;
# the landing page and Rust docs on that branch are left alone).
name: Docs

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm run build
        working-directory: website
      - name: Publish to gh-pages/guide
        run: |
          git fetch origin gh-pages
          git worktree add ../pages origin/gh-pages
          rm -rf ../pages/guide && cp -r website/build ../pages/guide
          cd ../pages
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A guide && git commit -m "docs: publish guide from ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:gh-pages
