<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>News Ticker</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A breaking-news tag, headline strip and a bottom ticker bar with text scrolling right to left without end.">
<meta name="se:tags" content="news, ticker, breaking, headline, lower third, broadcast">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="6s">
<meta name="se:field" content="tag | text | BREAKING">
<meta name="se:field" content="headline | text | City unveils plan to turn the old harbour into a public park">
<meta name="se:field" content="ticker | text | Markets close higher as tech stocks rally  |  Heavy rain expected across the region this weekend  |  Local team reaches the final for the first time in ten years">
<meta name="se:field" content="accent | color | #e11d2e">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { position: relative; width: 100vw; height: 100vh; font-family: "Segoe UI", Arial, sans-serif; }

  .headline { position: absolute; left: 80px; right: 80px; bottom: 112px; height: 88px; display: flex;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
  .tag { flex: none; display: flex; align-items: center; padding: 0 40px; background: var(--accent); color: #fff;
    font: 400 38px/1 "Arial Black", "Segoe UI", Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase;
    max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
    animation: tag .6s cubic-bezier(.2, 1.1, .3, 1) both; }
  .title { flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 40px; background: #fff; color: #10131a;
    font-size: 44px; font-weight: 700; white-space: nowrap;
    animation: wipe .7s cubic-bezier(.5, 0, .2, 1) .35s both; }
  .title span { overflow: hidden; text-overflow: ellipsis; }

  .bar { position: absolute; left: 0; right: 0; bottom: 40px; height: 64px; overflow: hidden; background: #10131a;
    border-top: 3px solid var(--accent); box-shadow: 0 10px 24px rgba(0, 0, 0, .4);
    animation: rise .5s cubic-bezier(.2, 1, .3, 1) .15s both; }
  .track { display: flex; width: max-content; height: 100%; align-items: center; animation: scroll 24s linear .9s infinite both; }
  .seg { flex: none; box-sizing: border-box; min-width: 1920px; padding-right: 96px; display: flex; align-items: center;
    color: #fff; font-size: 34px; font-weight: 600; white-space: pre; }
  .seg::after { content: ""; flex: none; width: 14px; height: 14px; margin-left: 96px; background: var(--accent); transform: rotate(45deg); }

  @keyframes tag { from { transform: translateX(-120%); } to { transform: none; } }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rise { from { transform: translateY(110%); } to { transform: none; } }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>
<div class="headline"><div class="tag">{{tag}}</div><div class="title"><span>{{headline}}</span></div></div>
<div class="bar"><div class="track"><div class="seg">{{ticker}}</div><div class="seg">{{ticker}}</div></div></div>
</body>
</html>
