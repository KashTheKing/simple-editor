<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bell Ring</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A notification bell swings and rings with sound-wave arcs while a red badge pops in.">
<meta name="se:tags" content="bell, notification, ring, badge, alert, subscribe, youtuber">
<meta name="se:size" content="400x360">
<meta name="se:duration" content="4.5s">
<meta name="se:thumb" content="1.1">
<meta name="se:field" content="badge | text | 3">
<meta name="se:field" content="accent | color | #ffc233">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .wrap { position: relative; width: 176px; height: 176px; }
  .disc { position: absolute; inset: 0; border-radius: 50%; background: rgba(18, 18, 22, .86);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
    animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) both; }
  .bell { position: absolute; left: 40px; top: 36px; width: 96px; height: 96px; transform-origin: 50% 6%;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35));
    animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) .08s both, ring 1.2s ease-out .55s 3 both; }
  .clap { animation: clap 1.2s ease-out .55s 3 both; transform-box: fill-box; transform-origin: 50% 0; }

  .waves { position: absolute; inset: 0; }
  .waves svg { position: absolute; top: 50%; width: 40px; height: 88px; margin-top: -52px; overflow: visible;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .waves .l { left: -48px; }
  .waves .r { right: -48px; transform: scaleX(-1); }
  .waves path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
    animation: wave 1.2s ease-out .6s 3 both; }
  .waves path + path { animation-delay: .72s; }

  .badge { position: absolute; left: 116px; top: 8px; min-width: 56px; max-width: 132px; height: 56px;
    box-sizing: border-box; padding: 0 14px; border-radius: 28px; border: 4px solid #fff;
    background: #ff3040; color: #fff; font-size: 28px; font-weight: 800; line-height: 48px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .35); transform-origin: 28px 50%;
    animation: badge .6s cubic-bezier(.2, 1.7, .4, 1) .75s both; }

  @keyframes pop { from { transform: scale(0); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); } }
  @keyframes ring { 0% { rotate: 0deg; } 8% { rotate: 26deg; } 20% { rotate: -22deg; } 32% { rotate: 16deg; }
    44% { rotate: -10deg; } 56% { rotate: 5deg; } 68% { rotate: -2deg; } 80%, 100% { rotate: 0deg; } }
  @keyframes clap { 0% { translate: 0; } 10% { translate: -5px 0; } 22% { translate: 5px 0; }
    34% { translate: -3px 0; } 46% { translate: 2px 0; } 60%, 100% { translate: 0; } }
  @keyframes wave { 0% { opacity: 0; translate: 16px 0; } 15% { opacity: 1; } 60%, 100% { opacity: 0; translate: -8px 0; } }
  @keyframes badge { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="disc"></div>
  <div class="waves">
    <svg class="l" viewBox="0 0 40 88"><path d="M28 18a36 36 0 0 0 0 52"/><path d="M12 6a52 52 0 0 0 0 76"/></svg>
    <svg class="r" viewBox="0 0 40 88"><path d="M28 18a36 36 0 0 0 0 52"/><path d="M12 6a52 52 0 0 0 0 76"/></svg>
  </div>
  <svg class="bell" viewBox="0 0 48 48">
    <circle cx="24" cy="5" r="3.2" fill="var(--accent)"/>
    <path class="clap" d="M18.5 38.5a5.5 5.5 0 0 0 11 0z" fill="var(--accent)"/>
    <path d="M24 6.5c-7.4 0-12.6 5.6-12.6 13v8.4l-3.6 5.6c-.9 1.4.1 3.2 1.8 3.2h28.8c1.7 0 2.7-1.8 1.8-3.2l-3.6-5.6v-8.4c0-7.4-5.2-13-12.6-13z" fill="var(--accent)"/>
    <path d="M17 14.5c1.4-2.2 3.6-3.4 6-3.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <div class="badge">{{badge}}</div>
</div>
</body>
</html>
