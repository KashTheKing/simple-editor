<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower Third Bar</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A thick accent bar grows upward, then the name and role slide out from behind it.">
<meta name="se:tags" content="lower third, name, title, bar, accent">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="6s">
<meta name="se:field" content="name | text | Jordan Lee">
<meta name="se:field" content="role | text | Senior Editor">
<meta name="se:field" content="accent | color | #f59e0b">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .stage { position: absolute; left: 96px; bottom: 120px; display: flex; align-items: stretch; max-width: 1100px;
    filter: drop-shadow(0 12px 26px rgba(0, 0, 0, .4));
    animation: out .6s cubic-bezier(.5, 0, .8, .4) 5.2s both; }
  .bar { flex: none; width: 16px; border-radius: 4px 0 0 4px; background: var(--accent);
    transform-origin: 50% 100%; animation: grow .55s cubic-bezier(.7, 0, .2, 1) .1s both; }
  .clip { overflow: hidden; border-radius: 0 14px 14px 0; }
  .panel { padding: 16px 48px 18px 30px; background: rgba(12, 14, 20, .78);
    animation: slide .75s cubic-bezier(.2, .85, .2, 1) .6s both; }
  .name, .role { max-width: 900px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name { font-size: 54px; line-height: 1.15; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .role { margin-top: 2px; font-size: 28px; line-height: 1.3; font-weight: 600; color: #e3e7f0; letter-spacing: 1.5px; text-transform: uppercase; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes slide { from { transform: translateX(-101%); } to { transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateX(-36px); } }
</style>
</head>
<body><div class="stage"><div class="bar"></div><div class="clip"><div class="panel"><div class="name">{{name}}</div><div class="role">{{role}}</div></div></div></div></body>
</html>
