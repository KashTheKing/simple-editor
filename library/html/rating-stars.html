<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rating Stars</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="Five stars pop in and fill up to a rating, with a score label.">
<meta name="se:tags" content="rating, stars, review, score, five stars">
<meta name="se:size" content="760x220">
<meta name="se:duration" content="4s">
<meta name="se:field" content="rating | number | 4.5 | 0 | 5">
<meta name="se:field" content="label | text | Overall score">
<meta name="se:field" content="accent | color | #ffb800">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .card { box-sizing: border-box; width: 690px; padding: 22px 32px 24px; border-radius: 28px;
    background: rgba(22, 24, 30, .94); color: #fff; border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .4), 0 3px 8px rgba(0, 0, 0, .3);
    animation: in .55s cubic-bezier(.2, 1.3, .35, 1) both; }
  .label { font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: rgba(255, 255, 255, .7);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }

  .stars { position: relative; flex: none; width: 420px; height: 84px; }
  .layer { position: absolute; left: 0; top: 0; height: 84px; display: flex; }
  .base { width: 420px; }
  .fill { overflow: hidden; width: 0; animation: fill 1.8s cubic-bezier(.45, 0, .3, 1) .9s both; }
  .fill .s { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent)); }
  .s { flex: none; width: 84px; height: 84px; display: grid; place-items: center; }
  .s svg { width: 66px; height: 66px; }
  .base .s { animation: pop .45s cubic-bezier(.2, 1.8, .4, 1) both; }
  .base .s:nth-child(1) { animation-delay: .35s; } .base .s:nth-child(2) { animation-delay: .43s; }
  .base .s:nth-child(3) { animation-delay: .51s; } .base .s:nth-child(4) { animation-delay: .59s; }
  .base .s:nth-child(5) { animation-delay: .67s; }
  .base path { fill: rgba(255, 255, 255, .22); }
  .fill path { fill: var(--accent); }

  .score { display: flex; align-items: baseline; gap: 8px; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) 1.4s both; }
  .num { font-size: 76px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .den { font-size: 34px; font-weight: 600; color: rgba(255, 255, 255, .6); }

  @keyframes in { from { transform: translateY(40px) scale(.94); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fill { from { width: 0; } to { width: calc({{rating}} / 5 * 100%); } }
</style>
</head>
<body>
<div class="card">
  <div class="label">{{label}}</div>
  <div class="row">
    <div class="stars">
      <div class="layer base"><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z" stroke-linejoin="round"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div></div>
      <div class="layer fill"><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div><div class="s"><svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.9 7.500.7-5.700 5 1.700 7.400L12 17.800 5.500 21.800l1.700-7.400-5.700-5 7.500-.7z"/></svg></div></div>
    </div>
    <div class="score"><span class="num">{{rating}}</span><span class="den">/ 5</span></div>
  </div>
</div>
</body>
</html>
