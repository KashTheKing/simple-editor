<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meme Caption</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="Classic meme text: white Impact capitals with a thick black outline, top and bottom, each punching in.">
<meta name="se:tags" content="meme, caption, impact, funny, text, top text, bottom text">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="4s">
<meta name="se:field" content="top | text | When the build finally passes">
<meta name="se:field" content="bottom | text | But you forgot to save the file">
<meta name="se:field" content="font | font | Impact">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { position: relative; width: 100vw; height: 100vh; font-family: {{font}}; }

  .line { position: absolute; left: 80px; right: 80px; display: flex; justify-content: center; text-align: center;
    color: #fff; font-size: 128px; line-height: 1.06; letter-spacing: 2px; text-transform: uppercase;
    overflow-wrap: anywhere; }
  /* the outline: copies of the text around the white one (the fast renderer does not draw -webkit-text-stroke) */
  .p { display: grid; max-width: 100%; }
  .p > * { grid-area: 1 / 1; font-style: normal; font-weight: inherit; }
  .p > i { color: #000; }
  .p > b { position: relative; z-index: 1; } /* the white text above its outline copies (transformed ones paint later in a browser) */
  .p > i:nth-child(1) { transform: translate(7px, 0); } .p > i:nth-child(2) { transform: translate(-7px, 0); }
  .p > i:nth-child(3) { transform: translate(0, 7px); } .p > i:nth-child(4) { transform: translate(0, -7px); }
  .p > i:nth-child(5) { transform: translate(5px, 5px); } .p > i:nth-child(6) { transform: translate(-5px, 5px); }
  .p > i:nth-child(7) { transform: translate(5px, -5px); } .p > i:nth-child(8) { transform: translate(-5px, -5px); }
  .p > i:nth-child(9) { transform: translate(0, 12px); }
  .top { top: 36px; align-items: flex-start; }
  .bottom { bottom: 36px; align-items: flex-end; }
  .top .p { transform-origin: 50% 0; animation: punch .35s cubic-bezier(.2, 1.5, .4, 1) .2s both; }
  .bottom .p { transform-origin: 50% 100%; animation: punch .35s cubic-bezier(.2, 1.5, .4, 1) .9s both; }

  @keyframes punch { 0% { transform: scale(2.4); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="line top"><div class="p"><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><i>{{top}}</i><b>{{top}}</b></div></div>
<div class="line bottom"><div class="p"><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><i>{{bottom}}</i><b>{{bottom}}</b></div></div>
</body>
</html>
