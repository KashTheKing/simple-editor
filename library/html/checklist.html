<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Checklist</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A titled to-do list whose four items slide in and get ticked off one after another.">
<meta name="se:tags" content="checklist, todo, tick, steps, list, tasks">
<meta name="se:size" content="760x520">
<meta name="se:duration" content="6s">
<meta name="se:field" content="title | text | Before you upload">
<meta name="se:field" content="item1 | text | Write a strong hook">
<meta name="se:field" content="item2 | text | Record clean audio">
<meta name="se:field" content="item3 | text | Add captions">
<meta name="se:field" content="item4 | text | Design the thumbnail">
<meta name="se:field" content="accent | color | #22c55e">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .card { box-sizing: border-box; width: 680px; padding: 34px 40px 22px; border-radius: 30px;
    background: rgba(20, 22, 29, .95); color: #fff; border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 20px 48px rgba(0, 0, 0, .42), 0 3px 8px rgba(0, 0, 0, .3);
    animation: in .6s cubic-bezier(.2, 1.25, .35, 1) both; }
  .title { padding-bottom: 18px; border-bottom: 3px solid var(--accent); font-size: 40px; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item { display: flex; align-items: center; gap: 24px; height: 88px; animation: slide .5s cubic-bezier(.2, 1.1, .3, 1) var(--d) both; }
  .item + .item { border-top: 1px solid rgba(255, 255, 255, .1); }
  .box { position: relative; flex: none; width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px;
    border: 3px solid rgba(255, 255, 255, .45); animation: fillbox .3s ease-out var(--t) both; }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; padding: 6px; box-sizing: border-box; }
  .box path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; animation: draw .35s cubic-bezier(.5, 0, .2, 1) var(--t) both; }
  .text { min-width: 0; font-size: 34px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: done .35s ease-out var(--t) both; }

  .i1 { --d: .5s; --t: 1.1s; } .i2 { --d: 1s; --t: 2s; } .i3 { --d: 1.5s; --t: 2.9s; } .i4 { --d: 2s; --t: 3.8s; }

  @keyframes in { from { transform: translateY(50px) scale(.95); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
  @keyframes slide { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fillbox { from { background: transparent; border-color: rgba(255, 255, 255, .45); transform: scale(1); }
    50% { transform: scale(1.18); } to { background: var(--accent); border-color: var(--accent); transform: scale(1); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes done { from { color: #fff; } to { color: rgba(255, 255, 255, .62); } }
</style>
</head>
<body>
<div class="card">
  <div class="title">{{title}}</div>
  <div class="item i1"><div class="box"><svg viewBox="0 0 24 24"><path pathLength="1" d="M4.500 12.500l5 5L19.500 7"/></svg></div><div class="text">{{item1}}</div></div>
  <div class="item i2"><div class="box"><svg viewBox="0 0 24 24"><path pathLength="1" d="M4.500 12.500l5 5L19.500 7"/></svg></div><div class="text">{{item2}}</div></div>
  <div class="item i3"><div class="box"><svg viewBox="0 0 24 24"><path pathLength="1" d="M4.500 12.500l5 5L19.500 7"/></svg></div><div class="text">{{item3}}</div></div>
  <div class="item i4"><div class="box"><svg viewBox="0 0 24 24"><path pathLength="1" d="M4.500 12.500l5 5L19.500 7"/></svg></div><div class="text">{{item4}}</div></div>
</div>
</body>
</html>
