<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Speaker Name Tag</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A slightly tilted speaker name tag sticker that pops in with a small bounce.">
<meta name="se:tags" content="name tag, sticker, speaker, label">
<meta name="se:size" content="560x160">
<meta name="se:duration" content="4s">
<meta name="se:field" content="name | text | Dana Whitfield">
<meta name="se:field" content="accent | color | #f43f5e">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .tag { width: max-content; min-width: 260px; max-width: 460px; box-sizing: border-box; overflow: hidden; border-radius: 16px;
    background: #fff; transform: rotate(-3deg);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .35), 0 2px 4px rgba(0, 0, 0, .2);
    animation: pop .6s cubic-bezier(.2, 1.5, .4, 1) .1s both; }
  .top { padding: 7px 24px 6px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
  .name { padding: 12px 24px 16px; color: #15171e; font-size: 38px; line-height: 1.2; font-weight: 800;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  @keyframes pop { from { transform: rotate(-12deg) scale(0); opacity: 0; } 30% { opacity: 1; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
</style>
</head>
<body><div class="wrap"><div class="tag"><div class="top">Speaker</div><div class="name">{{name}}</div></div></div></body>
</html>
