<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Comment Bubble</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A video-site style comment card with avatar, username, time and likes slides up into view.">
<meta name="se:tags" content="comment, social, reaction, chat, card, youtuber">
<meta name="se:size" content="900x260">
<meta name="se:duration" content="5s">
<meta name="se:field" content="username | text | MayaPlays">
<meta name="se:field" content="comment | text | I did not expect that ending at all. Watched it three times already!">
<meta name="se:field" content="likes | text | 2.4K">
<meta name="se:field" content="avatar | image | ">
<meta name="se:field" content="accent | color | #3b82f6">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .card { box-sizing: border-box; width: 820px; display: flex; gap: 20px; padding: 24px 30px 22px 24px;
    background: #fff; color: #0f0f0f; border-radius: 26px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .32), 0 3px 8px rgba(0, 0, 0, .2);
    animation: up .65s cubic-bezier(.2, 1.25, .35, 1) both; }
  .avatar { position: relative; flex: none; width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    background: var(--accent); animation: avIn .45s cubic-bezier(.2, 1.6, .4, 1) .3s both; }
  .initial { position: absolute; inset: 0; display: block; text-align: center; line-height: 72px; font-size: 0; color: #fff;
    font-weight: 700; text-transform: uppercase; }
  .initial::first-letter { font-size: 36px; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .main { min-width: 0; flex: 1; }
  .meta { display: flex; align-items: baseline; gap: 12px; }
  .user { min-width: 0; font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { flex: none; font-size: 22px; color: #606060; }
  .text { margin-top: 6px; font-size: 28px; line-height: 1.3; color: #1a1a1a; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    animation: fade .5s ease-out .5s both; }
  .likes { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 22px; color: #404040;
    animation: fade .4s ease-out .8s both; }
  .likes svg { width: 26px; height: 26px; fill: var(--accent); animation: thumb .5s cubic-bezier(.2, 1.8, .4, 1) 1.1s both; transform-origin: 30% 80%; }

  @keyframes up { from { transform: translateY(70px) scale(.94); opacity: 0; } 55% { opacity: 1; } to { transform: none; } }
  @keyframes avIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes thumb { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.4) rotate(-18deg); } 100% { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<div class="card">
  <div class="avatar"><div class="initial">{{username}}</div><img src="{{avatar}}" alt=""></div>
  <div class="main">
    <div class="meta"><span class="user">{{username}}</span><span class="time">2 hours ago</span></div>
    <div class="text">{{comment}}</div>
    <div class="likes">
      <svg viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 21V10l4.2-7.2c1.4-.4 2.8.8 2.5 2.2L14 9h6.2c1.3 0 2.2 1.2 1.9 2.4l-1.8 7.6c-.3 1.2-1.4 2-2.6 2z"/></svg>
      <span>{{likes}}</span>
    </div>
  </div>
</div>
</body>
</html>
