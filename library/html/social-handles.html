<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Social Handle</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A pill with a cycling generic glyph and your @handle that slides in and shimmers.">
<meta name="se:tags" content="social, handle, follow, username, pill">
<meta name="se:size" content="720x120">
<meta name="se:duration" content="5s">
<meta name="se:field" content="handle | text | @yourchannel">
<meta name="se:field" content="accent | color | #8b5cf6">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .pill { display: flex; align-items: center; gap: 18px; max-width: 640px; padding: 10px 40px 10px 10px; border-radius: 999px;
    background: rgba(14, 16, 24, .88); box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    animation: in .7s cubic-bezier(.2, 1.2, .35, 1) .1s both; }
  .glyph { position: relative; flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); }
  .glyph svg { position: absolute; inset: 14px; width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .g1 { animation: g1 4s ease-in-out infinite both; }
  .g2 { animation: g2 4s ease-in-out infinite both; }
  .handle { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff; font-size: 38px; line-height: 1.3; font-weight: 700;
    letter-spacing: .3px; animation: slide .6s cubic-bezier(.2, .8, .2, 1) .4s both; }
  @keyframes in { from { opacity: 0; transform: translateY(20px) scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
  @keyframes g1 { 0%, 40% { opacity: 1; transform: scale(1); } 50%, 90% { opacity: 0; transform: scale(.5) rotate(-40deg); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes g2 { 0%, 40% { opacity: 0; transform: scale(.5) rotate(40deg); } 50%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.5) rotate(40deg); } }
</style>
</head>
<body><div class="wrap"><div class="pill"><div class="glyph">
<svg class="g1" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5.5"/><path d="M21.5 11v7a3.5 3.5 0 0 0 7 0v-2a12.5 12.5 0 1 0-5 10"/></svg>
<svg class="g2" viewBox="0 0 32 32"><circle cx="16" cy="11" r="5.5"/><path d="M5.5 28a10.5 10.5 0 0 1 21 0"/></svg>
</div><div class="handle">{{handle}}</div></div></div></body>
</html>
