<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Subscribe and Bell</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A subscribe button and a notification bell: the cursor clicks Subscribe, then the bell, which rings with a little burst.">
<meta name="se:tags" content="subscribe, bell, notification, button, cursor, social, youtuber">
<meta name="se:size" content="720x240">
<meta name="se:duration" content="5s">
<meta name="se:thumb" content="3.4">
<meta name="se:field" content="label | text | Subscribe">
<meta name="se:field" content="accent | color | #e62117">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .stage { position: relative; display: flex; gap: 16px; align-items: center; }
  .btn { position: relative; display: grid; align-items: center; height: 80px; padding: 0 40px;
    border-radius: 40px; overflow: hidden; background: var(--accent); color: #fff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .25);
    animation: pop .6s cubic-bezier(.2, 1.5, .4, 1) both, press .32s ease-in-out 1.5s both,
      toGrey .25s ease-out 1.62s both; }
  .lbl { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 12px;
    max-width: 380px; font-size: 32px; font-weight: 700; white-space: nowrap; }
  .lbl span { overflow: hidden; text-overflow: ellipsis; }
  .a { animation: out .12s ease-in 1.6s both; }
  .b { color: #0f0f0f; animation: in .35s cubic-bezier(.2, 1.4, .4, 1) 1.7s both; }
  .tick { flex: none; width: 30px; height: 30px; }
  .tick path { stroke-dasharray: 30; animation: draw .35s ease-out 1.8s both; }
  .ripple { position: absolute; right: 38px; top: 55%; width: 40px; height: 40px; margin: -20px -20px 0 0;
    border-radius: 50%; background: rgba(255, 255, 255, .55); animation: ripple .6s ease-out 1.58s both; }

  .bellbtn { position: relative; flex: none; width: 80px; height: 80px; border-radius: 50%;
    display: grid; place-items: center; background: #ececec;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .25);
    animation: pop .6s cubic-bezier(.2, 1.5, .4, 1) .12s both, press .32s ease-in-out 2.75s both,
      toAccent .25s ease-out 2.85s both; }
  .bell { grid-area: 1 / 1; width: 44px; height: 44px; transform-origin: 50% 8%; }
  .bell.o { animation: hide .1s linear 2.85s both; }
  .bell.f { animation: show .1s linear 2.85s both, ring 1.1s ease-out 2.9s both; }
  .burst { position: absolute; inset: 0; }
  .burst i { position: absolute; left: 50%; top: 50%; width: 5px; height: 18px; margin: -9px 0 0 -2.5px;
    border-radius: 2px; background: var(--accent); rotate: var(--a);
    animation: ray .55s cubic-bezier(.2, .8, .3, 1) 2.95s both; }
  .burst i:nth-child(even) { height: 11px; margin-top: -5.5px; }

  .cur { position: absolute; right: 90px; top: 44px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .45));
    animation: cIn .85s cubic-bezier(.3, .7, .2, 1) .55s both, cOut .6s cubic-bezier(.6, 0, .8, .4) 3.7s both; }
  .cur-move { animation: cMove .6s cubic-bezier(.5, 0, .2, 1) 2.1s both, tap .3s ease-in-out 2.75s both; }
  .cur svg { display: block; width: 44px; height: 52px; animation: tap .3s ease-in-out 1.5s both; }

  @keyframes pop { from { transform: scale(0); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); } }
  @keyframes press { 0%, 100% { scale: 1; } 45% { scale: .9 .86; } 75% { scale: 1.04; } }
  @keyframes toGrey { from { background: var(--accent); } to { background: #ececec; } }
  @keyframes toAccent { from { background: #ececec; } to { background: var(--accent); } }
  @keyframes out { to { opacity: 0; transform: translateY(-16px); } }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
  @keyframes ripple { from { transform: scale(0); opacity: 1; } to { transform: scale(14); opacity: 0; } }
  @keyframes hide { to { opacity: 0; } }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ring { 0% { rotate: 0deg; } 10% { rotate: 24deg; } 25% { rotate: -20deg; } 40% { rotate: 14deg; }
    55% { rotate: -9deg; } 70% { rotate: 5deg; } 85% { rotate: -2deg; } 100% { rotate: 0deg; } }
  @keyframes ray { from { transform: translateY(-34px) scaleY(.2); opacity: 0; }
    30% { opacity: 1; } to { transform: translateY(-62px) scaleY(1); opacity: 0; } }
  @keyframes cIn { from { transform: translate(160px, 140px); opacity: 0; } 20% { opacity: 1; } to { transform: none; } }
  @keyframes cMove { to { translate: 108px 10px; } }
  @keyframes tap { 50% { scale: .8; } }
  @keyframes cOut { to { translate: 160px 120px; opacity: 0; } }
</style>
</head>
<body>
<div class="stage">
  <div class="btn">
    <div class="ripple"></div>
    <div class="lbl a"><span>{{label}}</span></div>
    <div class="lbl b">
      <svg class="tick" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Subscribed</span>
    </div>
  </div>
  <div class="bellbtn">
    <div class="burst"><i style="--a:0deg"></i><i style="--a:45deg"></i><i style="--a:90deg"></i><i style="--a:135deg"></i><i style="--a:180deg"></i><i style="--a:225deg"></i><i style="--a:270deg"></i><i style="--a:315deg"></i></div>
    <svg class="bell o" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4.2L4.3 16.4c-.3.6.1 1.1.7 1.1h14c.6 0 1-.5.7-1.1L18 13.2V9a6 6 0 0 0-6-6z" fill="none" stroke="#0f0f0f" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0" fill="none" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="bell f" viewBox="0 0 24 24"><path d="M12 2.2a6.8 6.8 0 0 0-6.8 6.8v4L3.4 16.3c-.5.9.1 1.9 1.1 1.9h15c1 0 1.6-1 1.1-1.9L18.8 13V9A6.8 6.8 0 0 0 12 2.2z" fill="#fff"/><path d="M9 19.6a3 3 0 0 0 6 0z" fill="#fff"/></svg>
  </div>
  <div class="cur"><div class="cur-move"><svg viewBox="0 0 22 26"><path d="M2 1.5v19.5l5.2-4.6 3.4 7.6 3.6-1.6-3.4-7.4H18z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div>
</div>
</body>
</html>
