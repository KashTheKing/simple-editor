<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower Third Gradient</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A pill-shaped gradient plate with a round icon dot, a name and a role.">
<meta name="se:tags" content="lower third, name, title, gradient, pill">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="6s">
<meta name="se:field" content="name | text | Riley Chen">
<meta name="se:field" content="role | text | Creator and Storyteller">
<meta name="se:field" content="color_a | color | #7c3aed">
<meta name="se:field" content="color_b | color | #ec4899">
<style>
  :root { --a: {{color_a}}; --b: {{color_b}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .stage { position: absolute; left: 96px; bottom: 120px; max-width: 1100px;
    filter: drop-shadow(0 12px 26px rgba(0, 0, 0, .4));
    animation: out .6s cubic-bezier(.5, 0, .8, .4) 5.2s both; }
  .pill { display: flex; align-items: center; gap: 24px; padding: 16px 56px 16px 16px; border-radius: 999px;
    background: linear-gradient(100deg, var(--a), var(--b));
    animation: grow .9s cubic-bezier(.65, 0, .2, 1) .1s both; }
  .dot { flex: none; width: 76px; height: 76px; border-radius: 50%; background: #fff; position: relative;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25); animation: pop .5s cubic-bezier(.2, 1.5, .4, 1) .45s both; }
  .dot::before { content: ""; position: absolute; left: 26px; top: 26px; width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--a), var(--b)); }
  .txt { min-width: 0; animation: fade .6s ease-out .65s both; }
  .name, .role { max-width: 820px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
  .name { font-size: 46px; line-height: 1.15; font-weight: 700; }
  .role { font-size: 26px; line-height: 1.3; font-weight: 400; opacity: .95; }
  @keyframes grow { from { clip-path: inset(0 100% 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes fade { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateY(24px); } }
</style>
</head>
<body><div class="stage"><div class="pill"><div class="dot"></div><div class="txt"><div class="name">{{name}}</div><div class="role">{{role}}</div></div></div></div></body>
</html>
