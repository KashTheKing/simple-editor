<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Number Counter</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A big number that counts up from zero to your target with a label underneath.">
<meta name="se:tags" content="counter, number, milestone, subscribers, stats">
<meta name="se:size" content="760x260">
<meta name="se:duration" content="5s">
<meta name="se:field" content="target | number | 250000 | 0 | 999999999">
<meta name="se:field" content="label | text | subscribers">
<meta name="se:field" content="accent | color | #34d399">
<meta name="se:field" content="font | font | Segoe UI">
<meta name="se:field" content="radius | radius | 28 | 0 | 120">
<meta name="se:field" content="shadow | toggle | on | 0 12px 34px rgba(0, 0, 0, .4) | none">
<meta name="se:field" content="outline | outline | 0 #ffffff">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: {{font}}; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { box-sizing: border-box; width: 680px; height: 180px; padding: 0 30px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: {{radius}}; outline: {{outline}}; outline-offset: -1px; background: rgba(12, 14, 22, .86); box-shadow: {{shadow}}; overflow: hidden;
    animation: in .6s cubic-bezier(.2, 1.2, .35, 1) .1s both; }
  /* the number is an odometer: nine digit wheels, each rolled to its digit of the target (no counters, no @property) */
  .num { --t: {{target}}; display: flex; height: 1.05em; overflow: hidden; color: #fff; font-size: 100px; line-height: 1.05; font-weight: 900; font-variant-numeric: tabular-nums; }
  .d { --v: mod(round(down, var(--t) / var(--k), 1), 10); display: block; height: 1.05em; overflow: hidden;
    opacity: clamp(0, round(down, var(--t) / var(--k), 1), 1); } /* leading zeros are hidden */
  .d.u { opacity: 1; }
  .d i { display: block; font-style: normal; animation: roll 3.4s cubic-bezier(.2, .7, .2, 1) .4s both; }
  .label { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 6px; padding-top: 10px; position: relative;
    color: var(--accent); font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
  .label::before { content: ""; position: absolute; left: 50%; top: 0; width: 64px; height: 4px; margin-left: -32px; border-radius: 2px; background: var(--accent);
    animation: bar .6s cubic-bezier(.2, .8, .2, 1) .5s both; }
  @keyframes roll { from { transform: translateY(0); } to { transform: translateY(calc(var(--v) * -1.05em)); } }
  @keyframes in { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</head>
<body><div class="wrap"><div class="card"><div class="num"><span class="d" style="--k:100000000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:10000000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:1000000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:100000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:10000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:1000"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:100"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d" style="--k:10"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span><span class="d u" style="--k:1"><i>0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</i></span></div><div class="label">{{label}}</div></div></div></body>
</html>
