<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Number Counter</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A big number that counts up from zero to your target with a label underneath.">
<meta name="se:tags" content="counter, number, milestone, subscribers, stats">
<meta name="se:size" content="760x260">
<meta name="se:duration" content="5s">
<meta name="se:field" content="target | number | 250000 | 0 | 999999999">
<meta name="se:field" content="label | text | subscribers">
<meta name="se:field" content="accent | color | #34d399">
<style>
  @property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { box-sizing: border-box; width: 680px; height: 180px; padding: 0 30px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 28px; background: rgba(12, 14, 22, .86); box-shadow: 0 12px 34px rgba(0, 0, 0, .4); overflow: hidden;
    animation: in .6s cubic-bezier(.2, 1.2, .35, 1) .1s both; }
  .num { color: #fff; font-size: 100px; line-height: 1.05; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap;
    counter-reset: n var(--n); animation: count 3.4s cubic-bezier(.2, .7, .2, 1) .4s both; }
  .num::before { content: counter(n); }
  .label { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 6px; padding-top: 10px; position: relative;
    color: var(--accent); font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
  .label::before { content: ""; position: absolute; left: 50%; top: 0; width: 64px; height: 4px; margin-left: -32px; border-radius: 2px; background: var(--accent);
    animation: bar .6s cubic-bezier(.2, .8, .2, 1) .5s both; }
  @keyframes count { from { --n: 0; } to { --n: {{target}}; } }
  @keyframes in { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</head>
<body><div class="wrap"><div class="card"><div class="num"></div><div class="label">{{label}}</div></div></div></body>
</html>
