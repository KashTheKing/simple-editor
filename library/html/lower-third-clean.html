<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower Third Clean</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A name and role on a soft dark plate that wipes in from the left and slides away at the end.">
<meta name="se:tags" content="lower third, name, title, clean, interview">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="6s">
<meta name="se:field" content="name | text | Alex Morgan">
<meta name="se:field" content="role | text | Founder and Host">
<meta name="se:field" content="accent | color | #38bdf8">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .stage { position: absolute; left: 96px; bottom: 120px; max-width: 1100px;
    filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .4));
    animation: out .6s cubic-bezier(.5, 0, .8, .4) 5.2s both; }
  .plate { position: relative; padding: 24px 52px 26px 42px; border-radius: 14px;
    background: rgba(12, 14, 20, .82);
    animation: wipe .85s cubic-bezier(.7, 0, .2, 1) .1s both; }
  .plate::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 6px;
    border-radius: 0 4px 4px 0; background: var(--accent); }
  .name, .role { max-width: 960px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name { font-size: 52px; line-height: 1.15; font-weight: 700; color: #fff; letter-spacing: .2px;
    animation: up .6s cubic-bezier(.2, .8, .2, 1) .5s both; }
  .role { margin-top: 4px; font-size: 28px; line-height: 1.3; font-weight: 400; color: #d4dae6; letter-spacing: .4px;
    animation: up .6s cubic-bezier(.2, .8, .2, 1) .65s both; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0 round 14px); } to { clip-path: inset(0 0 0 0 round 14px); } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateX(-36px); } }
</style>
</head>
<body><div class="stage"><div class="plate"><div class="name">{{name}}</div><div class="role">{{role}}</div></div></div></body>
</html>
