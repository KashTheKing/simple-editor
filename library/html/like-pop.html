<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Like Pop</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A thumbs-up pops with a ring burst and confetti particles, with a like counter beside it.">
<meta name="se:tags" content="like, thumbs up, social, pop, burst, counter, youtuber">
<meta name="se:size" content="560x280">
<meta name="se:duration" content="3.5s">
<meta name="se:thumb" content="1.4">
<meta name="se:field" content="count | text | 12.4K">
<meta name="se:field" content="accent | color | #3d8bff">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .pill { display: flex; align-items: center; gap: 24px; height: 112px; padding: 0 40px 0 16px;
    max-width: 400px; box-sizing: border-box; border-radius: 56px;
    background: rgba(18, 18, 22, .86); border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
    animation: pillIn .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .thumb { position: relative; flex: none; width: 80px; height: 80px; }
  .disc { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, .12);
    animation: fill .2s ease-out .62s both; }
  .icon { position: absolute; inset: 18px; transform-origin: 30% 80%;
    animation: thumbPop .7s cubic-bezier(.3, 1.6, .5, 1) .5s both; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--accent);
    animation: ring .6s cubic-bezier(.1, .7, .3, 1) .62s both; }
  .bits { position: absolute; left: 50%; top: 50%; }
  .bits i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%;
    background: var(--c, var(--accent)); rotate: var(--a);
    animation: bit .75s cubic-bezier(.15, .8, .3, 1) .64s both; }
  .bits i:nth-child(3n) { --c: #ffd23f; width: 7px; height: 7px; margin: -3.5px; }
  .bits i:nth-child(3n+1) { --c: #fff; }
  .count { min-width: 0; overflow: hidden; color: #fff; font-size: 48px; font-weight: 800;
    letter-spacing: -.5px; white-space: nowrap; text-overflow: ellipsis; line-height: 1.2;
    animation: countIn .5s cubic-bezier(.2, 1.3, .4, 1) .85s both; }

  @keyframes pillIn { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fill { to { background: var(--accent); } }
  @keyframes thumbPop { 0% { transform: scale(1); } 25% { transform: scale(.7) rotate(8deg); }
    60% { transform: scale(1.3) rotate(-18deg); } 100% { transform: none; } }
  @keyframes ring { 0% { transform: scale(.8); opacity: 0; border-width: 10px; } 8% { opacity: 1; }
    100% { transform: scale(1.9); opacity: 0; border-width: 1px; } }
  @keyframes bit { 0% { transform: translateY(-24px) scale(0); opacity: 0; }
    15% { transform: translateY(-36px) scale(1.3); opacity: 1; } 70% { opacity: 1; }
    100% { transform: translateY(-96px) scale(0); opacity: 0; } }
  @keyframes countIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="pill">
  <div class="thumb">
    <div class="ring"></div>
    <div class="disc"></div>
    <svg class="icon" viewBox="0 0 24 24"><path d="M2 10.2h3.6v10.6H2zM7.6 20.8h9.6a2.2 2.2 0 0 0 2.1-1.7l1.6-7.2a2.2 2.2 0 0 0-2.1-2.7h-4.7l.8-3.9a2 2 0 0 0-3.6-1.5L7.6 9.9z" fill="#fff"/></svg>
    <div class="bits"><i style="--a:0deg"></i><i style="--a:36deg"></i><i style="--a:72deg"></i><i style="--a:108deg"></i><i style="--a:144deg"></i><i style="--a:180deg"></i><i style="--a:216deg"></i><i style="--a:252deg"></i><i style="--a:288deg"></i><i style="--a:324deg"></i></div>
  </div>
  <div class="count">{{count}}</div>
</div>
</body>
</html>
