<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quote Card</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A rounded quote card with a large quotation mark; the text reveals downward line by line, then the author.">
<meta name="se:tags" content="quote, testimonial, card, review, text">
<meta name="se:size" content="1200x640">
<meta name="se:duration" content="6s">
<meta name="se:field" content="quote | text | The best way to predict the future is to build it, one small step at a time.">
<meta name="se:field" content="author | text | Morgan Ellis, Product Designer">
<meta name="se:field" content="accent | color | #6366f1">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { position: relative; box-sizing: border-box; width: 1040px; padding: 40px 72px 44px; border-radius: 32px; background: #fff;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35), 0 4px 10px rgba(0, 0, 0, .15);
    animation: pop .8s cubic-bezier(.2, 1.15, .35, 1) .1s both; }
  .mark { height: 84px; color: var(--accent); font-family: Georgia, "Times New Roman", serif; font-size: 190px; line-height: 1; font-weight: 700;
    overflow: hidden; animation: scale .6s cubic-bezier(.2, 1.5, .4, 1) .45s both; transform-origin: 0 100%; }
  .quote { margin: 4px 0 0; color: #1b1e27; font-family: Georgia, "Times New Roman", serif; font-size: 48px; line-height: 1.35; font-weight: 400;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 34%, transparent 66%, transparent 100%);
    -webkit-mask-size: 100% 300%; -webkit-mask-repeat: no-repeat;
    animation: reveal 1.8s cubic-bezier(.4, 0, .3, 1) .8s both; }
  .author { display: flex; align-items: center; gap: 18px; margin-top: 30px; animation: up .7s cubic-bezier(.2, .8, .2, 1) 2.3s both; }
  .author::before { content: ""; flex: none; width: 56px; height: 4px; border-radius: 2px; background: var(--accent); }
  .author span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #4b5162; font-size: 28px; font-weight: 600; letter-spacing: .4px; }
  @keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes scale { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes reveal { from { -webkit-mask-position: 0 100%; transform: translateY(10px); } to { -webkit-mask-position: 0 0; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body><div class="wrap"><div class="card"><div class="mark">&ldquo;</div><div class="quote">{{quote}}</div><div class="author"><span>{{author}}</span></div></div></div></body>
</html>
