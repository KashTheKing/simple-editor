<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phone Messages</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A phone text conversation: four bubbles appear one after another, with typing dots before each incoming message.">
<meta name="se:tags" content="text message, chat, phone, conversation, typing, sms, story">
<meta name="se:size" content="720x900">
<meta name="se:duration" content="6.5s">
<meta name="se:thumb" content="5.6">
<meta name="se:field" content="contact | text | Maya">
<meta name="se:field" content="msg1 | text | are you seriously uploading today??">
<meta name="se:field" content="msg2 | text | editing the last scene right now">
<meta name="se:field" content="msg3 | text | ok but the thumbnail better be good">
<meta name="se:field" content="msg4 | text | trust me. best one yet">
<meta name="se:field" content="accent | color | #2f80ff">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, "Segoe UI Emoji", sans-serif; }

  .phone { width: 600px; height: 780px; box-sizing: border-box; display: flex; flex-direction: column;
    border-radius: 48px; background: #fff; overflow: hidden;
    box-shadow: 0 0 0 10px #16171b, 0 0 0 11px rgba(255, 255, 255, .18), 0 24px 64px rgba(0, 0, 0, .5);
    animation: phoneIn .7s cubic-bezier(.2, 1.1, .3, 1) both; }
  .head { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 32px 24px 16px; background: #f6f6f8; border-bottom: 1px solid #e2e2e6; }
  .av { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(145deg, #a6b0c4, #7d879b); color: #fff; font-weight: 700; }
  .av b { display: block; font-size: 0; }
  .av b::first-letter { font-size: 34px; text-transform: uppercase; }
  .who { max-width: 100%; font-size: 24px; font-weight: 600; color: #111; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; text-align: center; font-size: 16px; font-weight: 400; color: #8a8a92; }

  .list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 24px 40px; }
  .row { display: grid; grid-template-rows: 0fr; }
  .row > .slot { min-height: 0; padding-top: 16px; align-self: end; }
  .r1 { animation: grow .35s cubic-bezier(.3, 0, .2, 1) .6s both; }
  .r2 { animation: grow .35s cubic-bezier(.3, 0, .2, 1) 2.2s both; }
  .r3 { animation: grow .35s cubic-bezier(.3, 0, .2, 1) 3s both; }
  .r4 { animation: grow .35s cubic-bezier(.3, 0, .2, 1) 4.7s both; }
  .time { text-align: center; font-size: 16px; color: #8a8a92; margin-bottom: 0; animation: show .4s ease-out .4s both; }
  .slot { display: grid; }
  .slot > * { grid-area: 1 / 1; }
  .in { justify-items: start; }
  .out { justify-items: end; }
  .b { max-width: 440px; padding: 14px 22px; border-radius: 28px; font-size: 28px; line-height: 1.3;
    overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden; }
  .in .b { background: #e9e9eb; color: #111; border-bottom-left-radius: 8px; transform-origin: 0 100%; }
  .out .b { background: var(--accent); color: #fff; border-bottom-right-radius: 8px; transform-origin: 100% 100%; }
  .typing { display: flex; gap: 6px; align-items: center; height: 54px; padding: 0 20px; box-sizing: border-box;
    align-self: end; border-radius: 26px; border-bottom-left-radius: 8px; background: #e9e9eb;
    transform-origin: 0 100%; }
  .typing i { width: 10px; height: 10px; border-radius: 50%; background: #8e8e93;
    animation: dot 1s ease-in-out infinite both; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  .read { grid-row: 2; margin-top: 4px; font-size: 15px; color: #8a8a92; animation: show .3s ease-out 5.4s both; }

  .s1 .typing { animation: typing 1s linear .7s both; }
  .s1 .b { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) 1.65s both; }
  .s2 .b { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) 2.5s both; }
  .s3 .typing { animation: typing 1.1s linear 3.1s both; }
  .s3 .b { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) 4.15s both; }
  .s4 .b { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) 5s both; }

  @keyframes phoneIn { from { opacity: 0; transform: translateY(80px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes typing { 0% { opacity: 0; transform: scale(.4); } 15%, 88% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.6); } }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
  @keyframes show { from { opacity: 0; } }
  @keyframes grow { to { grid-template-rows: 1fr; } }
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <div class="av"><b>{{contact}}</b></div>
    <div class="who">{{contact}}<small>Active now</small></div>
  </div>
  <div class="list">
    <div class="time">Today 9:41 PM</div>
    <div class="row r1"><div class="slot in s1"><div class="typing"><i></i><i></i><i></i></div><div class="b">{{msg1}}</div></div></div>
    <div class="row r2"><div class="slot out s2"><div class="b">{{msg2}}</div></div></div>
    <div class="row r3"><div class="slot in s3"><div class="typing"><i></i><i></i><i></i></div><div class="b">{{msg3}}</div></div></div>
    <div class="row r4"><div class="slot out s4"><div class="b">{{msg4}}</div><div class="read">Read</div></div></div>
  </div>
</div>
</body>
</html>
