<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bold Intro Title</title>
<meta name="se:kind" content="scene">
<meta name="se:desc" content="A big bold kinetic intro: a colour wipe, the title slams in with a shake and echo, an accent bar wipes under it and the subtitle rises.">
<meta name="se:tags" content="intro, title, bold, kinetic, opener, typography, energetic">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="4s">
<meta name="se:thumb" content="2.2">
<meta name="se:field" content="title | text | Built in a Weekend">
<meta name="se:field" content="subtitle | text | Episode 12 · The cardboard arcade">
<meta name="se:field" content="accent | color | #ffcc00">
<meta name="se:field" content="background | color | #121318">
<style>
  :root { --accent: {{accent}}; --bg: {{background}}; }
  html, body { margin: 0; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; background: var(--bg);
    font-family: "Segoe UI", Arial, sans-serif; color: #fff; }

  .stripes { position: absolute; inset: -200px; opacity: .06;
    background: repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 48px);
    animation: drift 8s linear infinite both; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255, 255, 255, .08), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, .5)); }
  .wipe { position: absolute; inset: -10% -30%; background: var(--accent); transform: skewX(-20deg);
    animation: wipe .5s cubic-bezier(.6, 0, .3, 1) .05s both; }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; animation: shake .32s linear .67s both; }
  .t { position: relative; display: grid; max-width: 1640px; }
  .t > div { grid-area: 1 / 1; text-align: center; text-transform: uppercase; font-size: 192px;
    font-weight: 900; line-height: .95; letter-spacing: -3px; text-wrap: balance; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding: 0 12px 12px; }
  .main { text-shadow: 10px 10px 0 var(--accent), 0 20px 40px rgba(0, 0, 0, .35);
    animation: slam .3s cubic-bezier(.5, 0, .9, .5) .37s both; }
  .echo { color: transparent; -webkit-text-stroke: 3px var(--accent); animation: echo .7s ease-out .67s both; }
  .echo.e2 { animation-delay: .77s; }
  .flash { position: absolute; inset: 0; background: #fff; animation: flash .35s ease-out .67s both; }

  .bar { width: 360px; height: 16px; margin-top: 40px; background: var(--accent); transform-origin: 0 50%;
    animation: bar .55s cubic-bezier(.7, 0, .2, 1) .9s both; }
  .sub { max-width: 1400px; margin-top: 32px; font-size: 48px; font-weight: 600; letter-spacing: 2px;
    color: rgba(255, 255, 255, .9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: up .7s cubic-bezier(.2, 1, .3, 1) 1.2s both; }

  @keyframes drift { to { transform: translateX(68px); } }
  @keyframes wipe { 0% { transform: skewX(-20deg) translateX(0); } 100% { transform: skewX(-20deg) translateX(130%); } }
  @keyframes slam { from { transform: scale(3.2); opacity: 0; filter: blur(16px); }
    to { transform: scale(1); opacity: 1; filter: blur(0); } }
  @keyframes shake { 0% { transform: translate(0, 0); } 15% { transform: translate(-14px, 10px); }
    30% { transform: translate(12px, -8px); } 45% { transform: translate(-8px, 6px); } 60% { transform: translate(6px, -4px); }
    80% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
  @keyframes echo { 0% { transform: scale(1); opacity: 0; } 2% { opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  @keyframes flash { 0% { opacity: 0; } 3% { opacity: .2; } 100% { opacity: 0; } }
  @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes up { from { opacity: 0; transform: translateY(32px); letter-spacing: 12px; }
    to { opacity: 1; transform: none; letter-spacing: 2px; } }
</style>
</head>
<body>
<div class="stripes"></div>
<div class="glow"></div>
<div class="stage">
  <div class="t">
    <div class="echo e2">{{title}}</div>
    <div class="echo">{{title}}</div>
    <div class="main">{{title}}</div>
  </div>
  <div class="bar"></div>
  <div class="sub">{{subtitle}}</div>
</div>
<div class="flash"></div>
<div class="wipe"></div>
</body>
</html>
