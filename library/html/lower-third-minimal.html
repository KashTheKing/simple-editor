<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lower Third Minimal</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="Just text with a thin accent underline that draws itself, fading up with a strong shadow.">
<meta name="se:tags" content="lower third, name, title, minimal, text">
<meta name="se:size" content="1920x1080">
<meta name="se:duration" content="6s">
<meta name="se:field" content="name | text | Taylor Brooks">
<meta name="se:field" content="role | text | Host of The Weekly Build">
<meta name="se:field" content="accent | color | #ffffff">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: "Segoe UI", Arial, sans-serif; }
  .stage { position: absolute; left: 96px; bottom: 120px; max-width: 1100px;
    animation: out .6s ease-in 5.2s both; }
  .box { display: block; width: max-content; max-width: 960px; }
  .name, .role { padding: 24px 28px; margin: -24px -28px; position: relative; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff;
    text-shadow: 0 2px 3px rgba(0, 0, 0, .85), 0 4px 22px rgba(0, 0, 0, .7), 0 0 2px rgba(0, 0, 0, .9); }
  .name { font-size: 64px; line-height: 1.12; font-weight: 700; animation: up .7s cubic-bezier(.2, .8, .2, 1) .35s both; }
  .line { height: 4px; margin: 10px 0 12px; border-radius: 2px; background: var(--accent); transform-origin: 0 50%;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .6); animation: draw .8s cubic-bezier(.7, 0, .2, 1) .1s both; }
  .role { font-size: 30px; line-height: 1.3; font-weight: 400; letter-spacing: 1px; animation: up .7s cubic-bezier(.2, .8, .2, 1) .6s both; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateY(-10px); } }
</style>
</head>
<body><div class="stage"><div class="box"><div class="name">{{name}}</div><div class="line"></div><div class="role">{{role}}</div></div></div></body>
</html>
