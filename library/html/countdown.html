<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Countdown 5 to 1</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A 5 to 1 countdown inside a ring that empties every second.">
<meta name="se:tags" content="countdown, timer, intro, numbers">
<meta name="se:size" content="400x400">
<meta name="se:duration" content="5s">
<meta name="se:thumb" content="2.6">
<meta name="se:field" content="accent | color | #22d3ee">
<meta name="se:field" content="font | font | Segoe UI">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent;
    font-family: {{font}}; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* dial: disc, track and a ring that is wiped away clockwise by a clip-path polygon (no svg animation, no counters) */
  .dial { position: absolute; left: 0; top: 0; width: 400px; height: 400px; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .45)); }
  .dial > * { position: absolute; border-radius: 50%; box-sizing: border-box; }
  .back { left: 32px; top: 32px; width: 336px; height: 336px; background: rgba(12, 14, 22, .82); }
  .track { left: 43px; top: 43px; width: 314px; height: 314px; border: 14px solid rgba(255, 255, 255, .16); }
  .ring { left: 43px; top: 43px; width: 314px; height: 314px; border: 14px solid var(--accent); animation: deplete 1s linear 0s 5 both; }
  .num { position: relative; width: 400px; height: 190px; color: #fff; font-size: 190px; line-height: 1; font-weight: 900;
    animation: pulse 1s cubic-bezier(.2, 1.4, .4, 1) 0s 5 both; }
  .num span { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; }
  .num .n5 { animation: n5 5s linear both; } .num .n4 { animation: n4 5s linear both; } .num .n3 { animation: n3 5s linear both; }
  .num .n2 { animation: n2 5s linear both; } .num .n1 { animation: n1 5s linear both; }
  @keyframes n5 { 0%, 19.99% { opacity: 1; } 20%, 100% { opacity: 0; } }
  @keyframes n4 { 0%, 19.99% { opacity: 0; } 20%, 39.99% { opacity: 1; } 40%, 100% { opacity: 0; } }
  @keyframes n3 { 0%, 39.99% { opacity: 0; } 40%, 59.99% { opacity: 1; } 60%, 100% { opacity: 0; } }
  @keyframes n2 { 0%, 59.99% { opacity: 0; } 60%, 79.99% { opacity: 1; } 80%, 100% { opacity: 0; } }
  @keyframes n1 { 0%, 79.99% { opacity: 0; } 80%, 100% { opacity: 1; } }
  @keyframes pulse { from { transform: scale(1.35); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  @keyframes deplete {
    0% { clip-path: polygon(50.0% 50.0%, 50.0% -50.0%, 120.7% -20.7%, 150.0% 50.0%, 120.7% 120.7%, 50.0% 150.0%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    12.5% { clip-path: polygon(50.0% 50.0%, 120.7% -20.7%, 120.7% -20.7%, 150.0% 50.0%, 120.7% 120.7%, 50.0% 150.0%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    25% { clip-path: polygon(50.0% 50.0%, 150.0% 50.0%, 150.0% 50.0%, 150.0% 50.0%, 120.7% 120.7%, 50.0% 150.0%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    37.5% { clip-path: polygon(50.0% 50.0%, 120.7% 120.7%, 120.7% 120.7%, 120.7% 120.7%, 120.7% 120.7%, 50.0% 150.0%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    50% { clip-path: polygon(50.0% 50.0%, 50.0% 150.0%, 50.0% 150.0%, 50.0% 150.0%, 50.0% 150.0%, 50.0% 150.0%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    62.5% { clip-path: polygon(50.0% 50.0%, -20.7% 120.7%, -20.7% 120.7%, -20.7% 120.7%, -20.7% 120.7%, -20.7% 120.7%, -20.7% 120.7%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    75% { clip-path: polygon(50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -50.0% 50.0%, -20.7% -20.7%, 50.0% -50.0%); }
    87.5% { clip-path: polygon(50.0% 50.0%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, -20.7% -20.7%, 50.0% -50.0%); }
    100% { clip-path: polygon(50.0% 50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%, 50.0% -50.0%); }
  }
</style>
</head>
<body><div class="wrap"><div class="dial"><div class="back"></div><div class="track"></div><div class="ring"></div></div><div class="num"><span class="n5">5</span><span class="n4">4</span><span class="n3">3</span><span class="n2">2</span><span class="n1">1</span></div></div></body>
</html>
