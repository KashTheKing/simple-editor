<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Callout Arrow</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A hand-drawn curved arrow sketches itself toward the lower left, ending at a marker-style label.">
<meta name="se:tags" content="arrow, callout, pointer, hand-drawn, label, highlight">
<meta name="se:size" content="640x360">
<meta name="se:duration" content="4s">
<meta name="se:field" content="label | text | Look at this!">
<meta name="se:field" content="accent | color | #ffd60a">
<meta name="se:field" content="font | font | Segoe UI">
<meta name="se:field" content="shadow | toggle | on | 5px 6px 0 rgba(0, 0, 0, .85), 0 14px 26px rgba(0, 0, 0, .3) | none">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { position: relative; width: 100vw; height: 100vh; font-family: {{font}}; }

  .label { position: absolute; right: 36px; top: 34px; max-width: 420px; box-sizing: border-box;
    padding: 12px 26px 14px; background: var(--accent); color: #111; border: 4px solid #111;
    border-radius: 10px 16px 12px 18px; font: 900 44px/1.1 "Segoe UI", Arial, sans-serif;
    letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: {{shadow}};
    transform: rotate(-3deg); animation: pop .5s cubic-bezier(.2, 1.5, .4, 1) both; }

  /* the arrow is drawn on by a clip that opens along it (the fast renderer cannot animate the inside of an svg) */
  .draw { position: absolute; inset: 0; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .35)); }
  .draw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .draw.body { animation: reveal .9s cubic-bezier(.45, .1, .3, 1) .45s both; }
  .draw.head { transform-origin: 100px 298px; animation: tip .35s ease-out 1.3s both; }

  @keyframes pop { from { transform: rotate(-12deg) scale(0); opacity: 0; } 50% { opacity: 1; } to { transform: rotate(-3deg) scale(1); } }
  @keyframes reveal { from { clip-path: inset(0 0 0 68.8%); } to { clip-path: inset(0 0 0 0); } }
  @keyframes tip { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="label">{{label}}</div>
<div class="draw body"><svg viewBox="0 0 640 360"><path fill="none" stroke="#111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M440 126 C 410 240 230 222 100 298"/><path fill="none" stroke="{{accent}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M440 126 C 410 240 230 222 100 298"/></svg></div>
<div class="draw head"><svg viewBox="0 0 640 360"><path fill="none" stroke="#111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M100 298 L 138 297"/><path fill="none" stroke="#111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M100 298 L 118 266"/><path fill="none" stroke="{{accent}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M100 298 L 138 297"/><path fill="none" stroke="{{accent}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M100 298 L 118 266"/></svg></div>
</body>
</html>
