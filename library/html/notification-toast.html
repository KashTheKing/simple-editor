<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Notification Toast</title>
<meta name="se:kind" content="layer">
<meta name="se:desc" content="A phone-style notification drops in from the top with an app icon, title and message, then slides away.">
<meta name="se:tags" content="notification, toast, alert, popup, phone, message">
<meta name="se:size" content="760x200">
<meta name="se:duration" content="5s">
<meta name="se:field" content="title | text | New message">
<meta name="se:field" content="body | text | Your video just passed 100,000 views. Congratulations!">
<meta name="se:field" content="accent | color | #34c759">
<style>
  :root { --accent: {{accent}}; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center;
    font-family: "Segoe UI", Arial, sans-serif; }

  .toast { box-sizing: border-box; width: 680px; display: flex; align-items: center; gap: 20px; padding: 18px 28px 18px 18px;
    background: rgba(28, 30, 36, .94); color: #fff; border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .4), 0 3px 8px rgba(0, 0, 0, .3);
    animation: in .6s cubic-bezier(.2, 1.3, .35, 1) .1s both, out .5s cubic-bezier(.6, 0, .8, .4) 4.2s both; }
  .icon { flex: none; width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
    animation: ring 1s ease-in-out .7s both; transform-origin: 50% 20%; }
  .icon svg { width: 42px; height: 42px; fill: #fff; }
  .txt { min-width: 0; flex: 1; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .title { min-width: 0; font-size: 28px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now { flex: none; font-size: 20px; color: rgba(255, 255, 255, .55); }
  .body { margin-top: 4px; font-size: 24px; line-height: 1.25; color: rgba(255, 255, 255, .85); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  @keyframes in { from { transform: translateY(-260px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes out { from { transform: none; opacity: 1; } to { transform: translateY(-260px); opacity: 0; } }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-14deg); } 30% { transform: rotate(12deg); }
    45% { transform: rotate(-8deg); } 60% { transform: rotate(5deg); } 75% { transform: rotate(0); } }
</style>
</head>
<body>
<div class="toast">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 0-2 2v.3A6.5 6.5 0 0 0 5.5 10.5v4L3.7 17.2c-.5.8 0 1.8 1 1.8h14.6c1 0 1.500-1 1-1.800l-1.800-2.700v-4A6.500 6.500 0 0 0 14 4.300V4a2 2 0 0 0-2-2zm-2.300 18a2.400 2.400 0 0 0 4.600 0z"/></svg></div>
  <div class="txt">
    <div class="head"><span class="title">{{title}}</span><span class="now">now</span></div>
    <div class="body">{{body}}</div>
  </div>
</div>
</body>
</html>
