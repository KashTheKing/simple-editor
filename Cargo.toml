[package]
name = "simple-editor"
version = "0.1.0"
edition = "2021"
description = "Simple Editor — a tiny, fast video trimmer/editor for Windows"
default-run = "simple-editor"

[[bin]]
name = "simple-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rfd = "0.17"
winreg = "0.56"
fontdb = "0.24"
ab_glyph = "0.2"
egui_tiles = { version = "0.14", features = ["serde"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
