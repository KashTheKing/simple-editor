# se-setup: Simple Editor's installer, updater and uninstaller - ONE small program, three roles.
# A SEPARATE program, not a member of the app's build (like tools/se-html): raw Win32 through windows-sys,
# WinHTTP for downloads, no GUI toolkit, so it opens instantly and stays well under 1 MB.
#
#   simple-editor-setup.exe   the installer (also downloads the app when no simple-editor.exe sits beside it)
#   update.exe                the same file copied into the install folder: the updater
#   uninstall.exe             the same file copied into the install folder: the uninstaller
#
# The role comes from the file name (or --update / --uninstall). Build: scripts/release.ps1.
[package]
name = "se-setup"
version = "1.4.0"
edition = "2021"
description = "Simple Editor setup, updater and uninstaller"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace]

[[bin]]
name = "simple-editor-setup"
path = "src/main.rs"

[dependencies]
# pure-Rust inflate for the FFmpeg / add-on zips (MIT/Apache/Zlib; already in the app's own build via png)
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
