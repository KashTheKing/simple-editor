# se-html: the fast HTML renderer helper (Blitz: Stylo + Taffy + Parley, painted on the CPU by vello_cpu).
# A SEPARATE program, not a member of the app's build: the app never links it (it would add ~10 MB) - it
# starts it as a child process and talks to it over stdin/stdout (src/proto.rs, shared with the app).
# Build: scripts/build-helper.ps1  (Rust 1.90 + `--ignore-rust-version`: beta.4 declares 1.91 but builds and
# renders the same on 1.89/1.90; see notes.md "Blitz helper").
[package]
name = "se-html"
version = "0.1.0"
edition = "2021"
description = "Simple Editor's HTML + CSS layer renderer (helper process)"
license = "MIT"
publish = false

[workspace]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "floats", "svg", "woff"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["filters"] }
peniko = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # a panic in the renderer is caught per command and reported, never fatal

[profile.release.package."*"]
opt-level = "s"

# dev builds: the renderer is far too slow unoptimised
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
